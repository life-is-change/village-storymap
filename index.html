<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 页面基础设置：声明字符集、移动端缩放方式和浏览器标签页标题 -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>村庄规划互动平台（教学）</title>
  <!-- 主入口说明：根目录 index.html 是整合平台外壳，homepage/dist 只是被嵌入的首页子页面 -->

  <!-- 本地样式和地图/后端 SDK：style.css 控制平台整体布局，OpenLayers 用于 2D 地图，Supabase 用于登录和数据存储 -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.8.0/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Cesium 3D 运行时改为进入 3D 视图时按需加载，避免首页被 3D 引擎拖慢。 -->
</head>
<body>
  <!-- 全局提示容器：JS 会把成功/失败提示消息插入到这里 -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- 应用外壳：包住整个平台的主界面，内部再分为顶部栏、左侧栏、中间内容和右侧详情栏 -->
  <div class="app-shell">
    <div class="app-card">
      <!-- 顶部栏：显示平台标题、返回首页按钮、当前用户和当前模式 -->
      <header class="topbar">
        <div class="topbar-left">
          <!-- 返回首页按钮：由 app.js 绑定点击事件，切回首页总览 -->
          <button id="homeBtn" class="home-btn" title="返回首页">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </button>
          <div>
            <h1>村庄规划互动平台（教学）</h1>

          </div>
        </div>
        <div class="topbar-right">
          <!-- 登录后显示当前用户问候；statusBadge 同时承担“当前模式显示”和“进入平台”的点击入口 -->
          <div id="userGreetingBadge" class="topbar-user-badge" style="display:none;"></div>
          <div id="statusBadge" class="topbar-badge">当前模式：首页</div>
        </div>
      </header>

      <!-- 主布局：课程阶段轨道、阶段情境栏、2D/3D 工作区和对象信息栏 -->
      <div id="mainLayout" class="main-layout mode-overview">
        <!-- 最左侧课程阶段轨道：常驻显示，按钮负责展开/收起相邻情境栏 -->
        <aside id="courseTaskSidebar" class="course-task-sidebar" aria-label="课程阶段">
          <div class="course-task-rail">
            <button
              id="courseTaskToggleBtn"
              type="button"
              class="course-task-toggle"
              aria-expanded="true"
              title="收起阶段情境"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 6-6 6 6 6"></path>
              </svg>
            </button>
            <nav id="courseTaskNav" class="course-task-nav" aria-label="课程阶段导航"></nav>
          </div>
        </aside>

        <!-- 阶段情境栏：替代旧菜单，只显示当前阶段成果、资料与建议操作 -->
        <aside id="courseContextPanel" class="story-panel course-context-panel" aria-label="阶段情境">
          <div class="course-context-panel-header">
            <button id="floatingHomeBtn" class="map-floating-home-btn" title="返回主页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </button>
            <div>
              <span>当前课程</span>
              <h2>米埗村规划实践</h2>
            </div>
          </div>
          <div id="courseWorkbenchContent" class="course-workbench-content"></div>
        </aside>

        <!-- 中间主内容区：同一时间只显示一个 content-view，例如首页、2D 地图或 3D 模型 -->
        <main class="center-panel">
          <!-- 稳定工作区上下文：课程阶段、空间与 2D/3D 均在这里切换 -->
          <div id="workspaceContextBar" class="workspace-context-bar" aria-label="当前工作区">
            <div class="workspace-context-identity">
              <span id="workspaceVillageLabel">米埗村</span>
              <strong id="workspaceStageLabel">课程实践</strong>
            </div>
            <div id="spaceHeaderSelect" class="workspace-space-select" aria-label="当前空间"></div>
            <div id="workspaceViewModeSwitch" class="workspace-view-mode-switch" aria-label="视图切换"></div>
            <button id="projectSettingsBtn" type="button" class="workspace-settings-btn" aria-expanded="false" title="图层与项目设置">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"></path>
              </svg>
              <span>图层与项目设置</span>
            </button>
          </div>

          <!-- 项目设置抽屉：承载空间、图层、问题、工具与导出等全局能力 -->
          <aside id="projectSettingsDrawer" class="project-settings-drawer" aria-hidden="true" aria-label="图层与项目设置">
            <header>
              <div><span>当前项目</span><h2>图层与项目设置</h2></div>
              <button id="projectSettingsCloseBtn" type="button" title="关闭设置">×</button>
            </header>
            <div class="project-settings-body">
              <div id="spaceList" class="space-list-panel active"></div>
            </div>
          </aside>

          <!-- 浮动控制区：进入地图/模型视图后，提供用户提示的浮动按钮 -->
          <div id="mapFloatingControls" class="map-floating-controls">
            <div id="floatingUserGreetingBadge" class="map-floating-user-badge" style="display:none;"></div>
          </div>

          <!-- 右侧面板收起按钮：用于给地图/模型视图腾出更多空间 -->
          <button id="rightPanelToggleBtn" type="button" class="map-side-toggle map-side-toggle-right" title="收起右栏">▶</button>

          <!-- 首页视图：默认 active。这里通过 iframe 嵌入 homepage/dist 里的 React 首页 -->
          <section id="overviewView" class="content-view active">
            <div class="home-landing-shell" style="position:relative;">
              <!-- 嵌入式首页构建产物：源码在 homepage/index.html 和 homepage/src/ 中 -->
              <iframe
                id="homeLandingFrame"
                class="home-landing-frame"
                src="./homepage/dist/index.html"
                title="村庄规划互动平台首页"
                data-entry-role="embedded-homepage-build"
                data-source-entry="homepage/index.html"
              ></iframe>
              <!-- 旧版浮动登录按钮，目前由 auth-system.js/app.js 控制显示状态，通常保持隐藏 -->
              <button id="authLoginBtn" type="button" class="auth-floating-btn" style="display:none;" title="点击登录/注册"></button>
            </div>

            <!-- 旧账号系统兼容桥：保留这些隐藏控件，供老逻辑读取/同步账号，不作为主要界面展示 -->
            <div class="legacy-identity-bridge" aria-hidden="true">
              <select id="identitySelect" class="identity-select"></select>
              <button id="confirmIdentityBtn" type="button">确认账号</button>
              <button id="createIdentityBtn" type="button">创建新账号</button>
              <button id="deleteIdentityBtn" type="button">删除账号</button>
              <p id="identityCurrentText">当前账号：未选择</p>
            </div>
          </section>

          <!-- 2D 地图视图：OpenLayers 地图容器和测量/重置视角等控件 -->
          <section id="plan2dView" class="content-view">
            <div class="map-frame">
              <!-- OpenLayers 会挂载到这个容器里，图层、要素和交互都由 JS 初始化 -->
              <div id="map2d" class="map2d-container"></div>
              <!-- 测量结果显示区：测距时由 app.js 更新文本 -->
              <div id="measure2dReadout" class="map-measure-readout"></div>
            </div>
          </section>
          <!-- 2D 刷新按钮：刷新社区任务与留言板 -->
          <button id="btnRefreshCommunityTask" class="map-recenter-btn map-refresh-btn" title="刷新留言">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
          <!-- 2D 测量按钮：进入距离测量模式 -->
          <button id="measure2dBtn" class="map-recenter-btn map-measure-btn" title="测量距离">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7l14-4 4 14-14 4z"></path>
              <path d="M7 8l2 2M10 7l2 2M13 6l2 2M6 11l2 2M5 14l2 2"></path>
            </svg>
          </button>
          <!-- 2D 动态比例尺：根据当前缩放级别与地图中心纬度实时更新 -->
          <div id="mapScaleBar" class="map-scale-bar" style="--scale-width: 96px;" aria-label="地图比例尺">
            <div id="mapScaleLabel" class="map-scale-label">100 m</div>
            <div class="map-scale-line"></div>
          </div>
          <!-- 2D 重置视角按钮：回到村庄中心/默认缩放级别 -->
          <button id="recenterBtn" class="map-recenter-btn" title="重置视角">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
            </svg>
          </button>

          <!-- 3D 模型视图：Cesium 场景容器和 3D 测量/重置视角等控件 -->
          <section id="model3dView" class="content-view">
            <div class="model-frame">
              <!-- Cesium 会挂载到这个容器里，用于显示地形、建筑白模和替换模型 -->
              <div id="cesiumContainer" class="cesium-container"></div>
              <!-- 3D 测量结果显示区 -->
              <div id="measure3dReadout" class="map-measure-readout"></div>
              <!-- 3D 操作提示：告诉用户如何移动、缩放、旋转场景 -->
              <div id="model3dHint" class="model-3d-hint">
                操作提示：左键拖拽平移，滚轮缩放，按住滚轮旋转；点击人形按钮可进入过肩视角漫游。
              </div>
            </div>
          </section>
          <!-- 3D 测量按钮：进入三维距离测量模式 -->
          <button id="measure3dBtn" class="map-recenter-btn map-measure-btn" title="测量距离">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7l14-4 4 14-14 4z"></path>
              <path d="M7 8l2 2M10 7l2 2M13 6l2 2M6 11l2 2M5 14l2 2"></path>
            </svg>
          </button>
          <!-- 3D 过肩视角漫游按钮：人物视角 + WASD + 鼠标控制 -->
          <button id="firstPerson3dBtn" class="map-recenter-btn map-first-person-btn" title="过肩视角漫游（W/A/S/D + 鼠标）" aria-label="过肩视角漫游">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="5" r="2.2"></circle>
              <path d="M12 7.5v5.3M8 11.2l4 1.6 4-1.6"></path>
              <path d="M10 13.2l-2.1 5.3M14 13.2l2.1 5.3"></path>
            </svg>
          </button>
          <!-- 3D 无人机飞行模式按钮：无人机视角 + WASD + Space/Ctrl + 鼠标控制 -->
          <button id="drone3dBtn" class="map-recenter-btn map-drone-btn" title="无人机飞行模式（W/A/S/D + Space/Ctrl + 鼠标）" aria-label="无人机飞行模式">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 6V2M12 22v-4M6 12H2M22 12h-4M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"></path>
              <path d="M18 6l-3 3M18 18l-3-3M6 18l3-3M6 6l3 3"></path>
              <circle cx="12" cy="12" r="1"></circle>
            </svg>
          </button>
          <!-- 3D 重置视角按钮：将相机飞回村庄默认观察位置 -->
          <button id="recenter3dBtn" class="map-recenter-btn" title="重置视角">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
            </svg>
          </button>
        </main>

        <!-- 右侧对象信息与协作栏 -->
        <aside class="detail-panel">
          <div class="panel-header">
            <h2>对象信息与协作</h2>
            <p id="detailSubtitle">选择地图对象后查看属性、照片、讨论与历史。</p>
          </div>

          <div id="infoPanel" class="info-panel empty">
            <div class="placeholder-block">
              <h3>尚未选择对象</h3>
              <p>选择建筑、道路、照片或问题点后，在此查看相关信息。</p>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>
 
  <!-- Cesium Ion 访问令牌：用于加载 Cesium 的在线资源/服务 -->
  <!-- 提示：如果浏览器控制台出现 "api.cesium.com ... 404" 且 3D 地形无法加载，说明此 token 已失效。
       请前往 https://ion.cesium.com/ 登录后创建新的 Access Token，并替换下面的值。 -->
  <script>
    window.CESIUM_ION_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJmYzZjYzZmMC1kNmVhLTRhMDctYTYxMS1mYzk4YmRiMGY4MjUiLCJpZCI6NDA4MjkyLCJpYXQiOjE3NzczNjUzOTl9.dlgwi60bAUwfDj0ImiYAve0bJnQ8NWIsFWQ-DPi53HM";
  </script>

  <!-- OpenLayers 动态导入：进入 2D 地图时才加载 OL 类，避免首页首屏被地图模块拖慢 -->
  <script type="module">
    window.__loadOpenLayers = function loadOpenLayers() {
      if (window.__olReady) return window.__olReady;

      window.__olReady = (async () => {
        const [
          MapMod,
          ViewMod,
          FeatureMod,
          GeoJSONMod,
          TileLayerMod,
          ImageLayerMod,
          VectorLayerMod,
          OSMMod,
          XYZMod,
          ImageStaticMod,
          VectorSourceMod,
          DrawMod,
          PointGeomMod,
          StyleMod,
          FillMod,
          StrokeMod,
          TextStyleMod,
          CircleStyleMod,
          ModifyMod,
          TranslateMod,
          SnapMod,
          CollectionMod,
          projMod,
        ] = await Promise.all([
          import("https://esm.sh/ol@10.8.0/Map"),
          import("https://esm.sh/ol@10.8.0/View"),
          import("https://esm.sh/ol@10.8.0/Feature"),
          import("https://esm.sh/ol@10.8.0/format/GeoJSON"),
          import("https://esm.sh/ol@10.8.0/layer/Tile"),
          import("https://esm.sh/ol@10.8.0/layer/Image"),
          import("https://esm.sh/ol@10.8.0/layer/Vector"),
          import("https://esm.sh/ol@10.8.0/source/OSM"),
          import("https://esm.sh/ol@10.8.0/source/XYZ"),
          import("https://esm.sh/ol@10.8.0/source/ImageStatic"),
          import("https://esm.sh/ol@10.8.0/source/Vector"),
          import("https://esm.sh/ol@10.8.0/interaction/Draw"),
          import("https://esm.sh/ol@10.8.0/geom/Point"),
          import("https://esm.sh/ol@10.8.0/style/Style"),
          import("https://esm.sh/ol@10.8.0/style/Fill"),
          import("https://esm.sh/ol@10.8.0/style/Stroke"),
          import("https://esm.sh/ol@10.8.0/style/Text"),
          import("https://esm.sh/ol@10.8.0/style/Circle"),
          import("https://esm.sh/ol@10.8.0/interaction/Modify"),
          import("https://esm.sh/ol@10.8.0/interaction/Translate"),
          import("https://esm.sh/ol@10.8.0/interaction/Snap"),
          import("https://esm.sh/ol@10.8.0/Collection"),
          import("https://esm.sh/ol@10.8.0/proj")
        ]);

        // 使用经纬度坐标，便于直接读取项目中的 GeoJSON/影像坐标。
        projMod.useGeographic();

        // 暴露给非 module 脚本：后续 app.js 可以从 window.__OL__ 里取 Map、Layer、Style 等类。
        window.__OL__ = {
          Map: MapMod.default,
          View: ViewMod.default,
          Feature: FeatureMod.default,
          GeoJSON: GeoJSONMod.default,
          TileLayer: TileLayerMod.default,
          ImageLayer: ImageLayerMod.default,
          VectorLayer: VectorLayerMod.default,
          OSM: OSMMod.default,
          XYZ: XYZMod.default,
          ImageStatic: ImageStaticMod.default,
          VectorSource: VectorSourceMod.default,
          Draw: DrawMod.default,
          Point: PointGeomMod.default,
          Style: StyleMod.default,
          Fill: FillMod.default,
          Stroke: StrokeMod.default,
          Text: TextStyleMod.default,
          Modify: ModifyMod.default,
          Translate: TranslateMod.default,
          Snap: SnapMod.default,
          Collection: CollectionMod.default,
          CircleStyle: CircleStyleMod.default,
          fromLonLat: projMod.fromLonLat,
          transformExtent: projMod.transformExtent
        };

        return window.__OL__;
      })();

      return window.__olReady;
    };
  </script>

  <!-- 业务脚本加载顺序很重要：基础系统先加载，主应用 app.js 启动；3D 脚本进入 3D 时再按需加载 -->
  <script defer src="features/auth/access-control.js"></script>
  <script defer src="auth-system.js"></script>
  <script defer src="community-tasks.js"></script>
  <script defer src="features/ui/map-style.js"></script>
  <script defer src="features/ui/space-panel.js"></script>
  <script defer src="features/ui/space-panel-events.js"></script>
  <script defer src="features/ui/view-switcher.js"></script>
  <script defer src="features/course/course-model.js"></script>
  <script defer src="features/course/course-service.js"></script>
  <script defer src="features/course/activity-logger.js"></script>
  <script defer src="features/course/course-workspace-adapter.js"></script>
  <script defer src="features/ui/course-workbench.js"></script>
  <script defer src="features/data/data-service.js"></script>
  <script defer src="features/data/feature-db.js?v=20260607-delete-tombstone"></script>
  <script defer src="features/data/copy-space-seed.js"></script>
  <script defer src="features/sync/supabase-sync-manager.js"></script>
  <script defer src="features/map-editing/geometry-editor.js"></script>
  <script defer src="features/mc/mc-bridge.js"></script>
  <script defer src="features/map-editing/map-hover-handler.js"></script>
  <script defer src="features/map-editing/map-click-handler.js"></script>
  <script defer src="features/map-editing/overlay-renderer.js?v=20260607-delete-tombstone"></script>
  <script defer src="app.js?v=20260607-delete-tombstone"></script>
  <!-- 自定义确认弹窗模板：替代浏览器原生 confirm，由 JS 控制显示和按钮回调 -->
  <div id="customConfirmModal" class="custom-modal-overlay is-hidden">
    <div class="custom-modal">
      <div class="custom-modal-header">
        <h3 class="custom-modal-title">确认</h3>
      </div>
      <div class="custom-modal-body">
        <p class="custom-modal-message" id="customConfirmMessage"></p>
      </div>
      <div class="custom-modal-footer">
        <button id="customConfirmCancel" class="custom-modal-btn custom-modal-btn-cancel">取消</button>
        <button id="customConfirmOk" class="custom-modal-btn custom-modal-btn-ok">确认</button>
      </div>
    </div>
  </div>

  <!-- 自定义输入弹窗模板：替代浏览器原生 prompt，用于输入名称等短文本 -->
  <div id="customPromptModal" class="custom-modal-overlay is-hidden">
    <div class="custom-modal">
