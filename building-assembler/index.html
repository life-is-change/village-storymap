<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建筑组装器 - 像明日之后一样搭建房子</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- GLTFExporter -->
  <script src="https://unpkg.com/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body>
  <div id="app">
    <!-- 顶部工具栏 -->
    <header class="toolbar">
      <div class="toolbar-left">
        <h1>🏠 建筑组装器</h1>
        <span class="subtitle">像明日之后一样搭建你的梦想房屋</span>
      </div>
      <div class="toolbar-center">
        <span id="targetInfo" class="target-info">未选择目标建筑</span>
      </div>
      <div class="toolbar-right">
        <button id="clearBtn" class="btn btn-danger">清空</button>
        <button id="undoBtn" class="btn btn-secondary">撤销</button>
        <button id="exportBtn" class="btn btn-primary">应用到主平台</button>
      </div>
    </header>

    <!-- 主工作区 -->
    <main class="workspace">
      <!-- 左侧组件面板 -->
      <aside class="component-panel">
        <div class="panel-section">
          <h3>基础结构</h3>
          <div class="component-grid">
            <div class="component-item" data-type="foundation" data-category="structure">
              <div class="component-icon">🏗️</div>
              <span>地基</span>
            </div>
            <div class="component-item" data-type="floor" data-category="structure">
              <div class="component-icon">⬜</div>
              <span>地板</span>
            </div>
            <div class="component-item" data-type="wall" data-category="structure">
              <div class="component-icon">🧱</div>
              <span>墙体</span>
            </div>
            <div class="component-item" data-type="wall_window" data-category="structure">
              <div class="component-icon">🪟</div>
              <span>窗户墙</span>
            </div>
            <div class="component-item" data-type="wall_door" data-category="structure">
              <div class="component-icon">🚪</div>
              <span>门框墙</span>
            </div>
            <div class="component-item" data-type="stairs" data-category="structure">
              <div class="component-icon">🪜</div>
              <span>楼梯</span>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <h3>屋顶</h3>
          <div class="component-grid">
            <div class="component-item" data-type="roof_flat" data-category="roof">
              <div class="component-icon">🏠</div>
              <span>平屋顶</span>
            </div>
            <div class="component-item" data-type="roof_gable" data-category="roof">
              <div class="component-icon">🏡</div>
              <span>人字顶</span>
            </div>
            <div class="component-item" data-type="roof_pyramid" data-category="roof">
              <div class="component-icon">🔺</div>
              <span>尖顶</span>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <h3>装饰</h3>
          <div class="component-grid">
            <div class="component-item" data-type="fence" data-category="decoration">
              <div class="component-icon">🎋</div>
              <span>围栏</span>
            </div>
            <div class="component-item" data-type="column" data-category="decoration">
              <div class="component-icon">🦵</div>
              <span>柱子</span>
            </div>
            <div class="component-item" data-type="balcony" data-category="decoration">
              <div class="component-icon">🌅</div>
              <span>阳台</span>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <h3>材质</h3>
          <div class="material-list">
            <div class="material-item active" data-material="concrete">
              <div class="material-preview" style="background: #8a8a8a;"></div>
              <span>混凝土</span>
            </div>
            <div class="material-item" data-material="brick">
              <div class="material-preview" style="background: #c4745a;"></div>
              <span>红砖</span>
            </div>
            <div class="material-item" data-material="wood">
              <div class="material-preview" style="background: #8b7355;"></div>
              <span>木材</span>
            </div>
            <div class="material-item" data-material="tile">
              <div class="material-preview" style="background: #4a6741;"></div>
              <span>青瓦</span>
            </div>
            <div class="material-item" data-material="stone">
              <div class="material-preview" style="background: #6b6b6b;"></div>
              <span>石材</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- 中间3D视图 -->
      <div class="viewport">
        <div id="canvas-container"></div>
        <div class="viewport-controls">
          <div class="control-group">
            <label>网格吸附</label>
            <input type="checkbox" id="snapGrid" checked>
          </div>
          <div class="control-group">
            <label>旋转角度</label>
            <select id="rotationStep">
              <option value="0">0°</option>
              <option value="90">90°</option>
              <option value="180">180°</option>
              <option value="270">270°</option>
            </select>
          </div>
          <div class="control-group">
            <label>楼层</label>
            <button id="levelUpBtn" class="btn-icon">⬆️</button>
            <span id="currentLevel">1</span>
            <button id="levelDownBtn" class="btn-icon">⬇️</button>
          </div>
        </div>
        <div class="viewport-hint">
          <p>🖱️ 滚轮按住拖拽旋转视角 | 滚轮缩放</p>
          <p>👆 点击组件放置 | 🗑️ 点击放置的组件删除 | ✋ 拖拽移动</p>
        </div>
      </div>

      <!-- 右侧属性面板 -->
      <aside class="properties-panel">
        <div class="panel-section">
          <h3>已放置组件</h3>
          <div id="componentList" class="component-list">
            <div class="empty-state">暂无组件，请从左侧选择</div>
          </div>
        </div>
        <div class="panel-section">
          <h3>统计信息</h3>
          <div class="stats">
            <div class="stat-item">
              <span class="stat-label">组件数量</span>
              <span id="componentCount" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">预估体积</span>
              <span id="totalVolume" class="stat-value">0 m³</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">预估成本</span>
              <span id="totalCost" class="stat-value">¥0</span>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- 状态提示 -->
  <div id="toast" class="toast"></div>

  <script src="assembler.js"></script>
</body>
</html>
