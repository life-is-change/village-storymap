server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    autoindex off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
