worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 server_tokens off;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 server {
  listen 8080;
  root /srv/village-web;
  index index.html;
  client_max_body_size 50m;
  add_header X-Content-Type-Options nosniff always;
  location ^~ /api/v1/ {
   proxy_pass http://village-unified-api:8080;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header Connection "";
   proxy_buffering off;
   proxy_request_buffering off;
   proxy_read_timeout 150s;
   proxy_send_timeout 150s;
   add_header Cache-Control "private, no-store" always;
  }
  location ~ (^|/)\. { return 403; }
  location ~* ^/(business-api|linux|server|supabase_SQL|supabase|tools|node_modules)(/|$) { return 404; }
  location = /deployment-config.js { add_header Cache-Control no-store; try_files $uri =404; }
  location / { try_files $uri $uri/ =404; }
 }
}
