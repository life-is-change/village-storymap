worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 server_tokens off;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 limit_req_zone $binary_remote_addr zone=auth:1m rate=2r/s;
 server {
  listen 8080;
  server_name 8.148.248.237;
  location ^~ /.well-known/acme-challenge/ { root /srv/acme; default_type text/plain; try_files $uri =404; }
  location / { return 308 https://8.148.248.237$request_uri; }
 }
 server {
  listen 8443 ssl;
  server_name 8.148.248.237;
  ssl_certificate /run/tls/current/fullchain.pem;
  ssl_certificate_key /run/tls/current/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  ssl_session_cache shared:TLS:1m;
  root /srv/village-web;
  index index.html;
  client_max_body_size 50m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location ^~ /auth/v1/admin { return 404; }
  location ^~ /auth/v1/ {
   client_max_body_size 64k;
   limit_req zone=auth burst=40 nodelay;
   proxy_pass http://auth:9999/;
   proxy_http_version 1.1;
   proxy_set_header Host 8.148.248.237;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header Connection "";
   proxy_buffering off;
   proxy_request_buffering off;
   proxy_read_timeout 60s;
  }
  location ^~ /api/worker/v1/ {
   client_max_body_size 8m;
   proxy_pass http://api:8080;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header Host 8.148.248.237;
   proxy_set_header X-Forwarded-Proto https;
   proxy_buffering off;
   proxy_request_buffering off;
   proxy_read_timeout 150s;
   proxy_send_timeout 150s;
   add_header Cache-Control "private, no-store" always;
  }
  location ^~ /api/v1/ {
   proxy_pass http://api:8080;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header Host 8.148.248.237;
   proxy_set_header X-Forwarded-Proto https;
   proxy_buffering off;
   proxy_request_buffering off;
   proxy_read_timeout 150s;
   proxy_send_timeout 150s;
   add_header Cache-Control "private, no-store" always;
  }
  location ~ (^|/)\. { return 403; }
  location ~* ^/(business-api|linux|server|supabase_SQL|supabase|tools|node_modules)(/|$) { return 404; }
  location = /deployment-config.js { add_header Cache-Control no-store; try_files $uri =404; }
  location / { try_files $uri $uri/ =404; }
 }
}
