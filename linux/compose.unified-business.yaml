# Reference only. deploy-unified-business.py writes the exact, receipt-bound private compose.json.
# The existing PostgreSQL service is deliberately external to this project.
name: village-unified
services:
  api:
    image: ${UNIFIED_VERIFIED_IMAGE:?use the deployment script}
    container_name: village-unified-api
    pull_policy: never
    user: ${UNIFIED_UID:?}:${UNIFIED_GID:?}
    read_only: true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.75
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:18084:8080"]
    networks: [dbnet, authegress]
    environment:
      PGHOST: village-api-validation-postgres
      PGPORT: "5432"
      PGDATABASE: village_unified_candidate
      PGUSER: village_unified_login
      PGPASSWORD_FILE: /run/secrets/api-password
      BRIDGE_ENABLED: "false"
  preview:
    image: village-web-nginx:ubuntu24-local
    container_name: village-unified-preview
    pull_policy: never
    read_only: true
    ports: ["127.0.0.1:18085:8080"]
    networks: [dbnet]
networks:
  dbnet:
    external: true
    name: village-api-validation_dbnet
  authegress:
    external: true
    name: village-api-validation_authegress
