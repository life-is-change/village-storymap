name: Platform regression
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install model processing dependencies
        run: npm ci --prefix tools/model-processor
      - name: Install API dependencies for shared upload contract tests
        run: npm ci --prefix business-api
      - run: npm test
      - name: Test model processing and bundled worker
        run: npm test --prefix tools/model-processor
      - name: Install pinned browser and bridge validation tools
        run: npm ci --prefix tools/unified-tests --ignore-scripts
      - name: Type check both private bridge transports
        run: npm --prefix tools/unified-tests run check:bridge -- --frozen
      - name: Install isolated Chromium test browser
        run: node tools/unified-tests/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test real page assembly and source versus Aliyun network routing
        run: npm --prefix tools/unified-tests run test:browser
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Terrain rollout fixtures attest the exact previously deployed bytes.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2 httpx==0.28.1 PyYAML==6.0.2 python-dotenv==1.1.0 numpy==2.2.6 Pillow==11.1.0 opencv-python-headless==4.11.0.86
      - name: Test deployment, probe safety and archive contracts
        run: python -m pytest linux/tests -q
      - name: Test existing Worker and private bridge input compatibility without real tasks
        working-directory: server
        run: python -m pytest tests/test_supabase_gateway.py tests/test_facade_gateway.py tests/test_worker.py tests/test_facade_worker.py tests/test_local_task_http.py tests/test_local_gateways.py tests/test_task_backend.py tests/test_facade_cli.py tests/test_health.py tests/test_source_status.py -q
