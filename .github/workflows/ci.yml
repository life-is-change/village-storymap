name: Platform regression
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install model processing dependencies
        run: npm ci --prefix tools/model-processor
      - name: Install API dependencies for shared upload contract tests
        run: npm ci --prefix business-api
      - run: npm test
      - name: Test model processing and bundled worker
        run: npm test --prefix tools/model-processor
