name: Unified native database tests
on:
  push:
    branches: [main, 'codex/**']
    paths: ['business-api/**', 'linux/sql/unified/**', 'supabase_SQL/Aliyun Task Bridge.sql', '.github/workflows/unified-native-tests.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VILLAGE_TEST_PG_URL: postgresql://village_test_admin:synthetic-ci-only@127.0.0.1:55441/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --prefix business-api
      - name: Start a disposable native PostGIS cluster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unified-empty-init"
          docker run --detach --name village-unified-ci \
            --publish 127.0.0.1:55441:5432 \
            --env POSTGRES_USER=village_test_admin \
            --env POSTGRES_PASSWORD=synthetic-ci-only \
            --env POSTGRES_DB=postgres \
            --env PGDATA=/var/lib/postgresql/data \
            --env POSTGRES_INITDB_ARGS='--encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256' \
            --mount "type=bind,source=$RUNNER_TEMP/unified-empty-init,target=/docker-entrypoint-initdb.d,readonly" \
            supabase/postgres:17.6.1.136 \
            postgres -D /var/lib/postgresql/data -c listen_addresses='*' \
              -c shared_preload_libraries=pg_stat_statements -c max_connections=25
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec village-unified-ci pg_isready -h 127.0.0.1 -U village_test_admin -d postgres; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          docker exec -i village-unified-ci sh -c 'cat > "$PGDATA/pg_hba.conf"' <<'HBA'
          local all all trust
          host village_unified_candidate village_unified_login 0.0.0.0/0 scram-sha-256
          host all village_unified_login 0.0.0.0/0 reject
          host all village_test_admin 0.0.0.0/0 scram-sha-256
          HBA
          docker exec village-unified-ci psql -X -v ON_ERROR_STOP=1 -U village_test_admin -d postgres -c \
            'SELECT pg_reload_conf(); CREATE SCHEMA extensions; CREATE EXTENSION postgis WITH SCHEMA extensions; SELECT extensions.postgis_lib_version();'
      - name: Unit contracts and shared pool
        run: node --test business-api/test/*.test.mjs
      - name: Native permission, geometry and connection budget integration
        run: node --test --test-concurrency=1 business-api/test/unified-database.integration.mjs business-api/test/unified-identity.integration.mjs business-api/test/unified-catalog.integration.mjs business-api/test/unified-survey.integration.mjs business-api/test/unified-planning.integration.mjs business-api/test/unified-events.integration.mjs business-api/test/unified-files.integration.mjs business-api/test/unified-bridge.integration.mjs business-api/test/unified-tasks.integration.mjs business-api/test/unified-http.integration.mjs
      - name: Database startup diagnostics on failure
        if: failure()
        run: docker logs --tail 70 village-unified-ci
      - name: Stop only this job's disposable container
        if: always()
        run: docker rm --force village-unified-ci
